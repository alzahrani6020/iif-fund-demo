<!-- Search Overlay Component -->
<div class="search-overlay" id="searchOverlay">
    <div class="search-container">
        <form class="search-form" id="searchForm">
            <div class="search-input-group">
                <input type="text" class="search-input" id="searchInput" placeholder="ابحث في القصائد، المعجم، الفيديوهات..." required>
                <button type="submit" class="search-submit">
                    <i class="fas fa-search"></i>
                </button>
                <button type="button" class="search-close" id="searchClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="search-filters">
                <label class="filter-checkbox">
                    <input type="checkbox" id="filter-poems" checked>
                    <span>القصائد</span>
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" id="filter-videos" checked>
                    <span>الفيديوهات</span>
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" id="filter-audio" checked>
                    <span>المكتبة الصوتية</span>
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" id="filter-dictionary" checked>
                    <span>المعجم</span>
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" id="filter-quotes" checked>
                    <span>الاقتباسات</span>
                </label>
            </div>
            
            <div class="search-results" id="searchResults">
                <!-- Search results will be displayed here -->
            </div>
        </form>
    </div>
</div>
