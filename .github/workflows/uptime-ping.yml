# فحص دوري لتوفر الموقع (HTTP 200) — بدون خدمة خارجية.
# GitHub Pages: إلزامي.
# عند فشل خطوة Pages: راجع النشر؛ فعّل إشعارات Actions من إعدادات GitHub.
name: Uptime ping

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  group: uptime-ping
  cancel-in-progress: true

jobs:
  github-pages:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages
        run: |
          set -e
          url="https://iiffund.com/"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 45 "$url")
          echo "$code <- $url"
          test "$code" = "200"

      - name: GitHub Pages — privacy.html
        run: |
          set -e
          url="https://iiffund.com/privacy.html"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 45 "$url")
          echo "$code <- $url"
          test "$code" = "200"

      - name: GitHub Pages — transparency.html
        run: |
          set -e
          url="https://iiffund.com/transparency.html"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 45 "$url")
          echo "$code <- $url"
          test "$code" = "200"

  production-searx-proxy-optional:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages — SearX proxy (JSON smoke — إعلامي)
        run: |
          url="https://iiffund.com/api/searx/search?q=iif&format=json&language=en&categories=general"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 35 "$url" || echo "000")
          echo "$code <- $url"
          if [ "$code" = "200" ] || [ "$code" = "429" ]; then
            echo "Proxy OK"
            exit 0
          fi
          echo "::notice::بروكسي SearX غير جاهز أو يعيد $code — متوقع على GitHub Pages (موقع ثابت)"
          exit 0
