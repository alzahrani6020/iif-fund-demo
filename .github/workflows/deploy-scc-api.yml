# نشر تطبيق SCC API على نفس VPS الـ SearXNG عبر SSH (الأسرار موجودة مسبقاً)
name: Deploy SCC API to VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scc380
        uses: actions/checkout@v4
        with:
          repository: alzahrani6020/scc380
          path: scc380

      - name: Build API image
        run: |
          cd scc380
          docker build --build-arg NODE_MAX_HEAP=3072 -f apps/api/Dockerfile -t scc-api:latest .
          # ضغط الصورة: النقل أصغر بكثير وأقل عرضة لانقطاع الجلسات الطويلة
          docker save scc-api:latest | gzip -1 > /tmp/scc-api.tar.gz

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.SEARXNG_VPS_SSH_PRIVATE_KEY }}
          P: ${{ secrets.SEARXNG_VPS_SSH_PORT }}
          HOST: ${{ secrets.SEARXNG_VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/vps_key && chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$P" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ship image and env to VPS
        env:
          P: ${{ secrets.SEARXNG_VPS_SSH_PORT }}
          HOST: ${{ secrets.SEARXNG_VPS_HOST }}
          USER_: ${{ secrets.SEARXNG_VPS_USER }}
        run: |
          RSYNC_SSH="ssh -i ~/.ssh/vps_key -p $P -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          # نقل قابل للاستئناف مع 3 محاولات (الخادم يقتل الجلسات الطويلة ~25-30 دقيقة)
          for i in 1 2 3; do
            if rsync -e "$RSYNC_SSH" -az --partial --append-verify /tmp/scc-api.tar.gz "${USER_}@${HOST}:~/scc-api.tar.gz"; then
              echo "transfer ok on attempt $i"; break
            fi
            echo "attempt $i failed — resuming"; sleep 15
            [ "$i" = "3" ] && exit 1
          done
          # ملف البيئة (القيم تُحقن من أسرار GitHub — لا تُطبع)
          ssh -i ~/.ssh/vps_key -p "$P" "${USER_}@${HOST}" "printf '%s\n' 'NODE_ENV=production' 'PORT=3001' 'DATABASE_URL=${{ secrets.SCC_API_DATABASE_URL }}' 'DIRECT_URL=${{ secrets.SCC_API_DIRECT_URL }}' 'JWT_SECRET=${{ secrets.SCC_API_JWT_SECRET }}' 'REDIS_URL=redis://scc-redis:6379' 'CORS_ORIGINS=https://dr-talal-h-alzahrani.com,https://www.dr-talal-h-alzahrani.com' > ~/scc-api.env"

      - name: Run stack on VPS
        env:
          P: ${{ secrets.SEARXNG_VPS_SSH_PORT }}
          HOST: ${{ secrets.SEARXNG_VPS_HOST }}
          USER_: ${{ secrets.SEARXNG_VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=15 \
            -i ~/.ssh/vps_key -p "$P" "${USER_}@${HOST}" '
            set -e
            docker tag scc-api:latest scc-api:rollback 2>/dev/null || true
            gunzip -c ~/scc-api.tar.gz | docker load
            docker network create scc-net 2>/dev/null || true
            mkdir -p ~/scc-caddy
            printf "%s\n" "api.dr-talal-h-alzahrani.com {" "    reverse_proxy scc-api:3001" "}" > ~/scc-caddy/Caddyfile
            # ترتيب آمن: لا نحذف شيئاً قبل أن يعمل بديله؛ فجوة التوقف تقتصر على ثوانٍ عند API فقط
            docker rm -f scc-caddy 2>/dev/null || true
            docker run -d --name scc-caddy --network scc-net --restart unless-stopped \
              -p 80:80 -p 443:443 -v ~/scc-caddy/Caddyfile:/etc/caddy/Caddyfile caddy:2
            docker rm -f scc-redis 2>/dev/null || true
            docker run -d --name scc-redis --network scc-net --restart unless-stopped redis:7-alpine
            docker rm -f scc-api 2>/dev/null || true
            docker run -d --name scc-api --network scc-net --restart unless-stopped \
              -p 127.0.0.1:3001:3001 --env-file ~/scc-api.env scc-api:latest
            # انتظار صحي متدرج: أول إقلاع يشغّل prisma db push وقد يأخذ دقائق على مخطط موسّع
            echo "--- health (up to ~3min) ---"
            code=000
            for i in $(seq 1 18); do
              sleep 10
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 http://127.0.0.1:3001 || true); code=${code:-000}
              echo "try $i: $code"
              if [ "$code" != "000" ]; then break; fi
            done
            echo "local api: $code"
            if [ "$code" = "000" ]; then
              echo "HEALTH CHECK FAILED — rolling back to previous image"
              docker rm -f scc-api
              docker run -d --name scc-api --network scc-net --restart unless-stopped \
                -p 127.0.0.1:3001:3001 --env-file ~/scc-api.env scc-api:rollback
              exit 1
            fi
            docker image prune -f || true
            docker ps --filter name=scc- --format "{{.Names}} {{.Status}}"
          '
