name: probe-db-secret-host
# Prints ONLY the hostname of the stored DB secret (no credentials).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hostname of SCC_API_DIRECT_URL (host only — no credentials)
        env:
          U: ${{ secrets.SCC_API_DIRECT_URL }}
        run: |
          node -e "
            try {
              const h = new URL(process.env.U).hostname;
              console.log('SCC_API_DIRECT_URL host:', h);
              console.log('isSupabase:', h.includes('supabase.co'));
              console.log('isRender:', h.includes('render.com'));
            } catch (e) { console.log('unparseable/empty'); }
          "
