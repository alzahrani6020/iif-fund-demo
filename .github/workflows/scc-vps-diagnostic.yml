# فحوص تشخيصية للـ VPS — قراءة فقط بالكامل. لا إعادة تشغيل، لا نشر، لا نقل.
name: SCC VPS Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.SEARXNG_VPS_SSH_PRIVATE_KEY }}
          P: ${{ secrets.SEARXNG_VPS_SSH_PORT }}
          HOST: ${{ secrets.SEARXNG_VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/vps_key && chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$P" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run read-only diagnostic
        env:
          P: ${{ secrets.SEARXNG_VPS_SSH_PORT }}
          HOST: ${{ secrets.SEARXNG_VPS_HOST }}
          USER_: ${{ secrets.SEARXNG_VPS_USER }}
        run: |
          RSYNC_SSH="ssh -i ~/.ssh/vps_key -p $P -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          rsync -e "$RSYNC_SSH" -az scc-ops/vps_diagnostic.sh "${USER_}@${HOST}:/tmp/vps_diagnostic.sh"
          $RSYNC_SSH "${USER_}@${HOST}" 'bash /tmp/vps_diagnostic.sh' | tee diagnostic-output.txt

      - uses: actions/upload-artifact@v4
        with:
          name: scc-vps-diagnostic
          path: diagnostic-output.txt
          retention-days: 90
