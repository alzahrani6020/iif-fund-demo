name: Render Set CORS
on:
  workflow_dispatch:
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set CORS_ORIGINS on scc380-api
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SID=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=100" | node scc-ops/render_list.cjs | grep "| scc380-api " | head -1 | cut -d'|' -f1 | tr -d ' ')
          echo "SID=$SID"
          [ -z "$SID" ] && { echo "service not found"; exit 1; }
          node -e "require('fs').writeFileSync('env.json', JSON.stringify([{key:'CORS_ORIGINS', value:'https://scc380-web.vercel.app,https://dr-talal-h-alzahrani.com,https://www.dr-talal-h-alzahrani.com'}]))"
          curl -s -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d @env.json "https://api.render.com/v1/services/$SID/env-vars" -o /dev/null -w "set: %{http_code}\n"
          curl -sf -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$SID/env-vars" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);const l=Array.isArray(j)?j:(j.envVars||[]);l.forEach(x=>{const v=x.envVar||x;if(v.key==='CORS_ORIGINS')console.log('CORS len:',(v.value||'').length)})}catch(e){}})"
