name: Render Fix Env
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set DATABASE_URL/DIRECT_URL/CORS_ORIGINS on scc380-api-image
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DB_URL: ${{ secrets.SCC_API_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SCC_API_DIRECT_URL }}
        run: |
          SID=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=100" | node scc-ops/render_list.cjs | grep "scc380-api-image" | head -1 | cut -d'|' -f1 | tr -d ' ')
          echo "service: $SID"
          [ -z "$SID" ] && { echo "service not found"; exit 1; }
          node -e "require('fs').writeFileSync('env.json', JSON.stringify([
            {key:'DATABASE_URL', value:'$DB_URL'},
            {key:'DIRECT_URL', value:'$DIRECT_URL'},
            {key:'CORS_ORIGINS', value:'https://scc380-web.vercel.app,https://dr-talal-h-alzahrani.com'}
          ]))"
          curl -s -X PUT -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d @env.json "https://api.render.com/v1/services/$SID/env-vars" | node scc-ops/render_list.cjs || true
          echo "=== verify env keys ==="
          curl -sf -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$SID/env-vars" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);(j.envVars||j).forEach(v=>console.log(v.key,'=',(v.value||'').length>0?('set('+String(v.value).length+' chars)'):'EMPTY'))}catch(e){console.log('verify parse fail')}})"
          echo "env updated — triggering deploy"
          curl -s -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' "https://api.render.com/v1/services/$SID/deploys" | node scc-ops/render_deploys.cjs || true

      - name: Wait and gates
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SID=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=100" | node scc-ops/render_list.cjs | grep "scc380-api-image" | head -1 | cut -d'|' -f1 | tr -d ' ')
          URL="https://scc380-api-image.onrender.com"
          echo "waiting for deploy..."
          for i in $(seq 1 40); do
            sleep 20
            ST=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$SID/deploys?limit=1" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log((j[0]&&j[0].deploy&&j[0].deploy.status)||'none')}catch(e){console.log('err')}})")
            echo "deploy: $ST (check $i)"
            [ "$ST" = "live" ] && break
            if [ "$ST" = "build_failed" ] || [ "$ST" = "update_failed" ]; then echo "DEPLOY FAILED"; exit 1; fi
          done
          echo "=== health ==="
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "$URL/" || true); code=${code:-000}
            echo "try $i: $code"
            [ "$code" != "000" ] && break
            sleep 10
          done
          echo "=== auth ==="
          curl -s -o /dev/null -w "login: %{http_code}\n" --max-time 15 -X POST "$URL/auth/login" -H "Content-Type: application/json" -d '{}'
          echo "GATES DONE"
