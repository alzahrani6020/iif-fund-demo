# إنشاء/تحديث سجل DNS في Cloudflare عبر أسرار المستودع (للطوارئ والنشر)
name: CF DNS Upsert

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "الدومين"
        required: true
        default: "dr-talal-h-alzahrani.com"
      name:
        description: "اسم السجل"
        required: true
        default: "api"
      content:
        description: "القيمة (IP للسجل A)"
        required: true
        default: "8.213.86.231"
      type:
        description: "نوع السجل"
        required: true
        default: "A"
      proxied:
        description: "خلف بروكسي Cloudflare؟ (true/false)"
        required: true
        default: "false"

jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert DNS record
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          ZONE="${{ github.event.inputs.zone }}"
          NAME="${{ github.event.inputs.name }}"
          FULL="$NAME.$ZONE"
          CONTENT="${{ github.event.inputs.content }}"
          TYPE="${{ github.event.inputs.type }}"
          PROXIED="${{ github.event.inputs.proxied }}"
          API="https://api.cloudflare.com/client/v4"
          echo "Zone: $ZONE | Record: $FULL $TYPE $CONTENT (proxied=$PROXIED)"

          ZONE_ID=$(curl -fsS --retry 4 --retry-all-errors -H "Authorization: Bearer $CF_TOKEN" "$API/zones?name=$ZONE" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          if [ -z "$ZONE_ID" ]; then
            echo "Zone not found or token lacks access: $ZONE"
            exit 1
          fi
          echo "Zone ID: $ZONE_ID"

          REC_ID=$(curl -fsS --retry 4 --retry-all-errors -H "Authorization: Bearer $CF_TOKEN" \
            "$API/zones/$ZONE_ID/dns_records?name=$FULL&type=$TYPE" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")

          DATA=$(python3 -c "import json,sys; print(json.dumps({'type':sys.argv[1],'name':sys.argv[2],'content':sys.argv[3],'proxied':sys.argv[4]=='true','ttl':1}))" "$TYPE" "$FULL" "$CONTENT" "$PROXIED")

          if [ -n "$REC_ID" ]; then
            echo "Updating existing record: $REC_ID"
            curl -fsS --retry 4 --retry-all-errors -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$API/zones/$ZONE_ID/dns_records/$REC_ID" -d "$DATA"
          else
            echo "Creating new record"
            curl -fsS --retry 4 --retry-all-errors -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "$API/zones/$ZONE_ID/dns_records" -d "$DATA"
          fi | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          if d.get("success"):
              r = d["result"]
              print("SUCCESS:", r["name"], r["type"], r["content"], "proxied=", r["proxied"])
              sys.exit(0)
          print("FAILED:", json.dumps(d.get("errors"), ensure_ascii=False))
          sys.exit(1)
          '
