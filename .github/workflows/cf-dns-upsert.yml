# إنشاء/تحديث سجل DNS في Cloudflare عبر أسرار المستودع (للطوارئ والنشر)
name: CF DNS Upsert

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "الدومين"
        required: true
        default: "dr-talal-h-alzahrani.com"
      name:
        description: "اسم السجل"
        required: true
        default: "api"
      content:
        description: "القيمة (IP للسجل A)"
        required: true
        default: "8.213.86.231"
      type:
        description: "نوع السجل"
        required: true
        default: "A"
      proxied:
        description: "خلف بروكسي Cloudflare؟ (true/false)"
        required: true
        default: "false"

jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert DNS record
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ github.event.inputs.zone }}
          CF_NAME: ${{ github.event.inputs.name }}
          CF_CONTENT: ${{ github.event.inputs.content }}
          CF_TYPE: ${{ github.event.inputs.type }}
          CF_PROXIED: ${{ github.event.inputs.proxied }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.request, urllib.error

          TOKEN = os.environ["CF_TOKEN"]
          ZONE = os.environ["CF_ZONE"]
          NAME = os.environ["CF_NAME"]
          FULL = f"{NAME}.{ZONE}"
          API = "https://api.cloudflare.com/client/v4"

          def call(method, path, body=None):
              req = urllib.request.Request(API + path, method=method)
              req.add_header("Authorization", f"Bearer {TOKEN}")
              data = None
              if body is not None:
                  req.add_header("Content-Type", "application/json")
                  data = json.dumps(body).encode()
              try:
                  with urllib.request.urlopen(req, data=data, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print(f"HTTP_ERROR {e.code}:", e.read().decode()[:500]); sys.exit(1)
              except Exception as e:
                  print("REQUEST_ERROR:", repr(e)); sys.exit(1)

          zones = call("GET", f"/zones?name={ZONE}")
          if not zones.get("result"):
              print("ZONE_NOT_FOUND:", ZONE); sys.exit(1)
          zone_id = zones["result"][0]["id"]
          print("Zone ID:", zone_id)

          t = os.environ["CF_TYPE"]
          recs = call("GET", f"/zones/{zone_id}/dns_records?name={FULL}&type={t}")
          existing = recs["result"][0]["id"] if recs.get("result") else None

          payload = {
              "type": t, "name": FULL,
              "content": os.environ["CF_CONTENT"],
              "proxied": os.environ["CF_PROXIED"] == "true",
              "ttl": 1,
          }
          if existing:
              print("Updating record:", existing)
              res = call("PUT", f"/zones/{zone_id}/dns_records/{existing}", payload)
          else:
              print("Creating record")
              res = call("POST", f"/zones/{zone_id}/dns_records", payload)

          if res.get("success"):
              r = res["result"]
              print(f"SUCCESS: {r['name']} {r['type']} {r['content']} proxied={r['proxied']}")
          else:
              print("FAILED:", json.dumps(res.get("errors"), ensure_ascii=False)); sys.exit(1)
          PYEOF
