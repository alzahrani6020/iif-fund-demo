<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d48a"/>
      <stop offset="40%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6e1c"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e0a0"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <!-- Silver/Steel ring -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <!-- Deep blue background -->
    <radialGradient id="blueBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a1525"/>
    </radialGradient>
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer laurel wreath (left) -->
  <g fill="url(#gold)" opacity="0.95">
    <ellipse cx="105" cy="200" rx="18" ry="42" transform="rotate(-25 105 200)"/>
    <ellipse cx="115" cy="165" rx="14" ry="32" transform="rotate(-15 115 165)"/>
    <ellipse cx="125" cy="235" rx="14" ry="32" transform="rotate(-35 125 235)"/>
    <ellipse cx="120" cy="130" rx="12" ry="26" transform="rotate(-5 120 130)"/>
    <ellipse cx="135" cy="270" rx="12" ry="26" transform="rotate(-45 135 270)"/>
    <ellipse cx="135" cy="105" rx="10" ry="22" transform="rotate(5 135 105)"/>
    <ellipse cx="155" cy="290" rx="10" ry="22" transform="rotate(-55 155 290)"/>
  </g>
  <!-- Outer laurel wreath (right) -->
  <g fill="url(#gold)" opacity="0.95">
    <ellipse cx="295" cy="200" rx="18" ry="42" transform="rotate(25 295 200)"/>
    <ellipse cx="285" cy="165" rx="14" ry="32" transform="rotate(15 285 165)"/>
    <ellipse cx="275" cy="235" rx="14" ry="32" transform="rotate(35 275 235)"/>
    <ellipse cx="280" cy="130" rx="12" ry="26" transform="rotate(5 280 130)"/>
    <ellipse cx="265" cy="270" rx="12" ry="26" transform="rotate(45 265 270)"/>
    <ellipse cx="265" cy="105" rx="10" ry="22" transform="rotate(-5 265 105)"/>
    <ellipse cx="245" cy="290" rx="10" ry="22" transform="rotate(55 245 290)"/>
  </g>

  <!-- Outer silver ring -->
  <circle cx="200" cy="205" r="130" fill="none" stroke="url(#silver)" stroke-width="10" filter="url(#shadow)"/>
  <circle cx="200" cy="205" r="125" fill="none" stroke="#6b7280" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner gold ring -->
  <circle cx="200" cy="205" r="110" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <!-- Blue globe background -->
  <circle cx="200" cy="205" r="100" fill="url(#blueBg)"/>

  <!-- Grid lines (globe) -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none">
    <ellipse cx="200" cy="205" rx="100" ry="35"/>
    <ellipse cx="200" cy="205" rx="100" ry="65"/>
    <line x1="200" y1="105" x2="200" y2="305"/>
    <line x1="100" y1="205" x2="300" y2="205"/>
    <ellipse cx="200" cy="205" rx="50" ry="100"/>
    <ellipse cx="200" cy="205" rx="80" ry="100"/>
  </g>

  <!-- Crown -->
  <g transform="translate(200, 68)" filter="url(#shadow)">
    <!-- Crown base -->
    <path d="M -38 0 Q -38 -18 -20 -22 L -15 -35 L -5 -25 L 0 -42 L 5 -25 L 15 -35 L 20 -22 Q 38 -18 38 0 Z" fill="url(#gold)"/>
    <!-- Crown jewels -->
    <circle cx="-20" cy="-14" r="3.5" fill="#16a34a"/>
    <circle cx="-5" cy="-20" r="4" fill="#16a34a"/>
    <circle cx="0" cy="-28" r="5" fill="#16a34a"/>
    <circle cx="5" cy="-20" r="4" fill="#16a34a"/>
    <circle cx="20" cy="-14" r="3.5" fill="#16a34a"/>
    <!-- Crown top orb -->
    <circle cx="0" cy="-46" r="6" fill="url(#goldLight)"/>
  </g>

  <!-- Eagle simplified (geometric wings) -->
  <g transform="translate(200, 205)">
    <!-- Wings left -->
    <path d="M -8 5 Q -35 -15 -55 -5 Q -65 5 -60 20 Q -50 35 -30 30 Q -15 25 -8 15 Z" fill="#b45309" opacity="0.9"/>
    <path d="M -8 5 Q -30 -25 -50 -15 Q -60 -5 -55 10" fill="none" stroke="#92400e" stroke-width="2"/>
    <!-- Wings right -->
    <path d="M 8 5 Q 35 -15 55 -5 Q 65 5 60 20 Q 50 35 30 30 Q 15 25 8 15 Z" fill="#b45309" opacity="0.9"/>
    <path d="M 8 5 Q 30 -25 50 -15 Q 60 -5 55 10" fill="none" stroke="#92400e" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="0" cy="12" rx="10" ry="22" fill="#f8fafc"/>
    <!-- Head -->
    <circle cx="0" cy="-8" r="12" fill="#f8fafc"/>
    <!-- Beak -->
    <path d="M -4 -6 Q 0 -2 4 -6 L 0 2 Z" fill="#fbbf24"/>
    <!-- Eye -->
    <circle cx="-3" cy="-10" r="2" fill="#1f2937"/>
    <circle cx="3" cy="-10" r="2" fill="#1f2937"/>
    <!-- Shield -->
    <path d="M -8 2 L 8 2 L 8 18 Q 0 26 -8 18 Z" fill="#dc2626" stroke="#f8fafc" stroke-width="1.5"/>
    <!-- Shield stripes -->
    <line x1="-8" y1="7" x2="8" y2="7" stroke="#f8fafc" stroke-width="2"/>
    <line x1="-8" y1="12" x2="8" y2="12" stroke="#f8fafc" stroke-width="2"/>
    <!-- Shield blue top -->
    <path d="M -8 2 L 8 2 L 8 6 L -8 6 Z" fill="#1e3a8f"/>
    <!-- Olive branch left -->
    <path d="M -15 25 Q -25 35 -20 45" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <ellipse cx="-22" cy="32" rx="5" ry="9" transform="rotate(-30 -22 32)" fill="#16a34a"/>
    <ellipse cx="-24" cy="40" rx="4" ry="7" transform="rotate(-40 -24 40)" fill="#16a34a"/>
    <!-- Arrows right -->
    <path d="M 15 25 L 28 38 M 28 38 L 22 38 M 28 38 L 26 32" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Text arc top: INTERNATIONAL INVESTMENT FUND -->
  <path id="arcTop" d="M 85,205 A 115,115 0 0,1 315,205" fill="none"/>
  <text font-family="Georgia, serif" font-size="13.5" font-weight="700" fill="url(#gold)" letter-spacing="2.5">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">INTERNATIONAL INVESTMENT FUND</textPath>
  </text>

  <!-- Bottom ribbon (gold) -->
  <g transform="translate(200, 328)" filter="url(#shadow)">
    <path d="M -90 0 Q -70 -18 0 -12 Q 70 -18 90 0 L 85 28 Q 70 18 0 24 Q -70 18 -85 28 Z" fill="url(#gold)"/>
    <path d="M -90 0 Q -70 -18 0 -12 Q 70 -18 90 0" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- Ribbon text -->
    <text x="0" y="12" font-family="Georgia, serif" font-size="11.5" font-weight="700" fill="#1a1508" text-anchor="middle" letter-spacing="1.5">FINANCING FOR GLOBAL PROSPERITY</text>
  </g>

  <!-- Bottom secondary ribbon (dark) -->
  <g transform="translate(200, 358)">
    <path d="M -65 0 Q -50 -10 0 -8 Q 50 -10 65 0 L 62 16 Q 50 10 0 12 Q -50 10 -62 16 Z" fill="#0f172a" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="0" y="8" font-family="Georgia, serif" font-size="9.5" font-weight="600" fill="#e8d48a" text-anchor="middle" letter-spacing="2">ALL NATIONS GLOBALLY</text>
  </g>
</svg>
