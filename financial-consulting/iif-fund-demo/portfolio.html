<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>Portfolio · IIF · International Investment Fund</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060a12" />
  <meta name="description" content="IIF investment portfolio across sovereign markets and strategic sectors." />
  <link rel="icon" type="image/svg+xml" href="assets/logo-v2.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/sovereign-system.css" />
  <link rel="stylesheet" href="css/sovereign-components.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/public-shell.css" />
  <link rel="stylesheet" href="css/public-components.css" />
  <style>
    .sov-project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-6); }
    .sov-project { background: var(--color-surface-elevated); border: 1px solid var(--color-glass-border); border-radius: var(--radius-lg); overflow: hidden; transition: all var(--transition-normal); }
    .sov-project:hover { border-color: var(--color-border-strong); box-shadow: var(--shadow-card-hover); transform: translateY(-4px); }
    .sov-project__img { width: 100%; height: 180px; background: linear-gradient(135deg, var(--sov-navy-800), var(--sov-navy-700)); display: flex; align-items: center; justify-content: center; font-size: var(--text-3xl); color: var(--sov-gold-500); opacity: 0.7; }
    .sov-project__body { padding: var(--space-5); }
    .sov-project__title { font-size: var(--text-lg); font-weight: 600; color: var(--color-text-main); margin-bottom: var(--space-2); }
    .sov-project__meta { font-size: var(--text-xs); color: var(--sov-gold-300); margin-bottom: var(--space-3); }
    .sov-project__desc { font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-relaxed); }
  </style>
</head>
<body>
  <div id="shared-header"></div>

  <section class="sov-section" style="padding-top: calc(var(--space-24) + 80px); text-align:center;">
    <div class="sov-container">
      <span class="sov-section-header__label"><span class="lang-en">Portfolio</span><span class="lang-ar">المحفظة</span></span>
      <h1 class="sov-section-header__title" style="font-size:var(--text-4xl);margin-bottom:var(--space-6);">
        <span class="lang-en">Our Projects</span>
        <span class="lang-ar">مشاريعنا</span>
      </h1>
      <p class="sov-section-header__desc" style="max-width:720px;margin-inline:auto;">
        <span class="lang-en">Active investments across infrastructure, energy, technology, and strategic industries in 50+ markets.</span>
        <span class="lang-ar">استثمارات نشطة عبر البنية التحتية والطاقة والتقنية والصناعات الاستراتيجية في أكثر من 50 سوقاً.</span>
      </p>
    </div>
  </section>

  <section class="sov-section" style="background:var(--sov-navy-900);">
    <div class="sov-container">
      <div class="sov-project-grid" id="project-grid"></div>
    </div>
  </section>

  <div id="shared-footer"></div>
  <script src="src/shared-nav.js"></script>
  <script src="src/shared-footer.js"></script>
  <script src="src/sov-reveal.js"></script>
  <script>
    (function(){ const lang = localStorage.getItem('iif-lang') || 'ar'; document.documentElement.setAttribute('data-lang', lang); document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr'); document.documentElement.setAttribute('lang', lang); })();

    fetch('data/projects.json')
      .then(r => r.json())
      .then(data => {
        const grid = document.getElementById('project-grid');
        if (!data.items) return;
        const lang = localStorage.getItem('iif-lang') || 'ar';
        grid.innerHTML = data.items.map(item =>
          '<article class="sov-project sov-reveal">' +
            '<div class="sov-project__img">' + item.icon + '</div>' +
            '<div class="sov-project__body">' +
              '<div class="sov-project__meta">' + item.region + ' · ' + item.value + '</div>' +
              '<h3 class="sov-project__title">' +
                '<span class="lang-en">' + item.title.en + '</span>' +
                '<span class="lang-ar">' + item.title.ar + '</span>' +
              '</h3>' +
              '<p class="sov-project__desc">' +
                '<span class="lang-en">' + item.desc.en + '</span>' +
                '<span class="lang-ar">' + item.desc.ar + '</span>' +
              '</p>' +
            '</div>' +
          '</article>'
        ).join('');
      });
  </script>
</body>
</html>
