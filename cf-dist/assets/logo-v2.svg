<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e0a0"/>
      <stop offset="35%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#7a5e10"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6e1c"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <radialGradient id="globe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#080d18"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crown -->
  <g transform="translate(250, 52)" filter="url(#shadow)">
    <!-- Crown base band -->
    <rect x="-45" y="12" width="90" height="18" rx="3" fill="url(#gold)"/>
    <!-- Points -->
    <path d="M -45 12 L -35 -20 L -20 -8 L 0 -25 L 20 -8 L 35 -20 L 45 12 Z" fill="url(#goldDark)"/>
    <!-- Orbs on tips -->
    <circle cx="-35" cy="-20" r="5.5" fill="url(#gold)"/>
    <circle cx="0" cy="-25" r="6.5" fill="url(#gold)"/>
    <circle cx="35" cy="-20" r="5.5" fill="url(#gold)"/>
    <circle cx="-20" cy="-8" r="4" fill="url(#gold)"/>
    <circle cx="20" cy="-8" r="4" fill="url(#gold)"/>
    <!-- Cross on top -->
    <circle cx="0" cy="-38" r="6" fill="url(#gold)"/>
    <rect x="-1.5" y="-50" width="3" height="24" fill="url(#gold)"/>
    <rect x="-8" y="-44" width="16" height="3" fill="url(#gold)"/>
    <!-- Jewels -->
    <circle cx="-30" cy="5" r="3.5" fill="#16a34a"/>
    <circle cx="-15" cy="5" r="3.5" fill="#16a34a"/>
    <circle cx="0" cy="5" r="4" fill="#16a34a"/>
    <circle cx="15" cy="5" r="3.5" fill="#16a34a"/>
    <circle cx="30" cy="5" r="3.5" fill="#16a34a"/>
  </g>

  <!-- Outer laurel wreath (left) -->
  <g fill="url(#gold)" filter="url(#shadow)">
    <ellipse cx="108" cy="270" rx="14" ry="34" transform="rotate(-22 108 270)"/>
    <ellipse cx="120" cy="225" rx="12" ry="28" transform="rotate(-12 120 225)"/>
    <ellipse cx="135" cy="185" rx="10" ry="24" transform="rotate(-5 135 185)"/>
    <ellipse cx="128" cy="315" rx="12" ry="28" transform="rotate(-32 128 315)"/>
    <ellipse cx="148" cy="350" rx="10" ry="22" transform="rotate(-42 148 350)"/>
    <ellipse cx="155" cy="155" rx="9" ry="20" transform="rotate(5 155 155)"/>
    <ellipse cx="172" cy="380" rx="8" ry="18" transform="rotate(-52 172 380)"/>
  </g>
  <!-- Outer laurel wreath (right) -->
  <g fill="url(#gold)" filter="url(#shadow)">
    <ellipse cx="392" cy="270" rx="14" ry="34" transform="rotate(22 392 270)"/>
    <ellipse cx="380" cy="225" rx="12" ry="28" transform="rotate(12 380 225)"/>
    <ellipse cx="365" cy="185" rx="10" ry="24" transform="rotate(5 365 185)"/>
    <ellipse cx="372" cy="315" rx="12" ry="28" transform="rotate(32 372 315)"/>
    <ellipse cx="352" cy="350" rx="10" ry="22" transform="rotate(42 352 350)"/>
    <ellipse cx="345" cy="155" rx="9" ry="20" transform="rotate(-5 345 155)"/>
    <ellipse cx="328" cy="380" rx="8" ry="18" transform="rotate(52 328 380)"/>
  </g>

  <!-- Silver outer ring -->
  <circle cx="250" cy="275" r="148" fill="none" stroke="url(#silver)" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="250" cy="275" r="142" fill="none" stroke="#6b7280" stroke-width="2" opacity="0.5"/>

  <!-- Gold inner ring -->
  <circle cx="250" cy="275" r="130" fill="none" stroke="url(#gold)" stroke-width="5"/>

  <!-- Globe background -->
  <circle cx="250" cy="275" r="120" fill="url(#globe)"/>

  <!-- Globe grid -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none">
    <ellipse cx="250" cy="275" rx="120" ry="42"/>
    <ellipse cx="250" cy="275" rx="120" ry="78"/>
    <ellipse cx="250" cy="275" rx="100" ry="120"/>
    <ellipse cx="250" cy="275" rx="60" ry="120"/>
    <line x1="250" y1="155" x2="250" y2="395"/>
    <line x1="130" y1="275" x2="370" y2="275"/>
  </g>

  <!-- EAGLE -->
  <g transform="translate(250, 275)">
    <!-- Wings left (layered feathers) -->
    <path d="M -6 0 C -35 -35 -75 -30 -95 -5 C -105 15 -100 40 -80 50 C -60 58 -40 45 -25 35 C -15 28 -8 20 -6 12 Z" fill="#b45309" filter="url(#shadow)"/>
    <path d="M -6 0 C -30 -25 -60 -22 -75 -5" fill="none" stroke="#92400e" stroke-width="2.5"/>
    <!-- Wing feather details left -->
    <path d="M -25 10 Q -45 5 -60 15" fill="none" stroke="#92400e" stroke-width="1.5" opacity="0.6"/>
    <path d="M -30 20 Q -50 18 -65 28" fill="none" stroke="#92400e" stroke-width="1.5" opacity="0.6"/>

    <!-- Wings right -->
    <path d="M 6 0 C 35 -35 75 -30 95 -5 C 105 15 100 40 80 50 C 60 58 40 45 25 35 C 15 28 8 20 6 12 Z" fill="#b45309" filter="url(#shadow)"/>
    <path d="M 6 0 C 30 -25 60 -22 75 -5" fill="none" stroke="#92400e" stroke-width="2.5"/>
    <path d="M 25 10 Q 45 5 60 15" fill="none" stroke="#92400e" stroke-width="1.5" opacity="0.6"/>
    <path d="M 30 20 Q 50 18 65 28" fill="none" stroke="#92400e" stroke-width="1.5" opacity="0.6"/>

    <!-- Body -->
    <ellipse cx="0" cy="15" rx="14" ry="30" fill="#f8fafc" filter="url(#shadow)"/>
    <path d="M 0 -8 L 0 42" stroke="#e5e7eb" stroke-width="1" opacity="0.5"/>

    <!-- Head -->
    <ellipse cx="0" cy="-18" rx="16" ry="20" fill="#f8fafc" filter="url(#shadow)"/>

    <!-- Beak -->
    <path d="M -5 -16 Q 0 -10 5 -16 L 0 -2 Z" fill="#fbbf24" stroke="#d97706" stroke-width="0.5"/>

    <!-- Eyes -->
    <ellipse cx="-6" cy="-22" rx="3.5" ry="4" fill="#1f2937"/>
    <ellipse cx="6" cy="-22" rx="3.5" ry="4" fill="#1f2937"/>
    <circle cx="-5" cy="-23" r="1.2" fill="#fff"/>
    <circle cx="7" cy="-23" r="1.2" fill="#fff"/>

    <!-- Shield on chest -->
    <path d="M -10 0 L 10 0 L 10 22 Q 0 32 -10 22 Z" fill="#dc2626" stroke="#f8fafc" stroke-width="2" filter="url(#shadow)"/>
    <!-- Shield stripes -->
    <line x1="-10" y1="7" x2="10" y2="7" stroke="#f8fafc" stroke-width="2.5"/>
    <line x1="-10" y1="14" x2="10" y2="14" stroke="#f8fafc" stroke-width="2.5"/>
    <!-- Shield blue chief -->
    <path d="M -10 0 L 10 0 L 10 5 L -10 5 Z" fill="#1e3a8f"/>

    <!-- Tail feathers -->
    <path d="M -8 42 L -12 58 L -4 52 L 0 62 L 4 52 L 12 58 L 8 42 Z" fill="#f8fafc" stroke="#d1d5db" stroke-width="0.5"/>

    <!-- Olive branch left -->
    <g transform="translate(-28, 40) rotate(-25)">
      <path d="M 0 0 Q -5 15 -2 25" fill="none" stroke="#15803d" stroke-width="3"/>
      <ellipse cx="-6" cy="8" rx="5" ry="10" fill="#16a34a"/>
      <ellipse cx="-8" cy="18" rx="4" ry="8" fill="#16a34a"/>
    </g>

    <!-- Arrows right -->
    <g transform="translate(28, 40) rotate(25)">
      <path d="M 0 0 L 0 22" fill="none" stroke="#6b7280" stroke-width="3"/>
      <path d="M -4 18 L 0 24 L 4 18" fill="none" stroke="#6b7280" stroke-width="2.5"/>
      <!-- Fletching -->
      <path d="M -3 4 L 3 4 M -3 8 L 3 8 M -3 12 L 3 12" stroke="#6b7280" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Arc text: INTERNATIONAL INVESTMENT FUND -->
  <path id="arcTop" d="M 140,275 A 110,110 0 0,1 360,275" fill="none"/>
  <text font-family="'Times New Roman', Georgia, serif" font-size="15" font-weight="700" fill="url(#gold)" letter-spacing="3" filter="url(#glow)">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">INTERNATIONAL INVESTMENT FUND</textPath>
  </text>

  <!-- Gold ribbon -->
  <g transform="translate(250, 445)" filter="url(#shadow)">
    <!-- Ribbon shape -->
    <path d="M -110 -5 Q -85 -28 0 -20 Q 85 -28 110 -5 L 105 32 Q 85 22 0 28 Q -85 22 -105 32 Z" fill="url(#gold)"/>
    <!-- Ribbon shine -->
    <path d="M -110 -5 Q -85 -28 0 -20 Q 85 -28 110 -5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Ribbon text -->
    <text x="0" y="12" font-family="'Times New Roman', Georgia, serif" font-size="14" font-weight="700" fill="#1a1508" text-anchor="middle" letter-spacing="2">FINANCING FOR GLOBAL PROSPERITY</text>
    <!-- Ribbon folds -->
    <path d="M -105 32 L -115 40 L -95 35 Z" fill="#7a5e10"/>
    <path d="M 105 32 L 115 40 L 95 35 Z" fill="#7a5e10"/>
  </g>

  <!-- Dark bottom ribbon -->
  <g transform="translate(250, 482)">
    <path d="M -80 -3 Q -60 -18 0 -14 Q 60 -18 80 -3 L 77 20 Q 60 14 0 16 Q -60 14 -77 20 Z" fill="#0f172a" stroke="url(#gold)" stroke-width="2"/>
    <text x="0" y="7" font-family="'Times New Roman', Georgia, serif" font-size="11.5" font-weight="600" fill="#e8d48a" text-anchor="middle" letter-spacing="2.5">ALL NATIONS GLOBALLY</text>
  </g>
</svg>
