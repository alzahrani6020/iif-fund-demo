<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>Press & Media · IIF · International Investment Fund</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060a12" />
  <meta name="description" content="Latest press releases, media coverage, and publications from the International Investment Fund (IIF)." />
  <link rel="icon" type="image/svg+xml" href="assets/logo-v2.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/sovereign-system.css" />
  <link rel="stylesheet" href="css/sovereign-components.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/public-shell.css" />
  <link rel="stylesheet" href="css/public-components.css" />
  <style>
    .sov-press-hero { position: relative; padding: calc(var(--space-24) + 60px) var(--section-px) var(--space-16); text-align: center; background: linear-gradient(180deg, var(--sov-navy-900), var(--sov-navy-800)); border-bottom: 1px solid var(--color-border); }
    .sov-press-hero__title { font-size: var(--text-4xl); font-weight: 600; margin-bottom: var(--space-4); background: linear-gradient(135deg, var(--sov-ivory) 0%, var(--sov-gold-300) 50%, var(--sov-ivory) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sov-press-hero__subtitle { font-size: var(--text-lg); color: var(--color-text-muted); max-width: 600px; margin: 0 auto; }
    .sov-press-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--space-6); padding: var(--space-10) var(--section-px); max-width: 1200px; margin: 0 auto; }
    .sov-press-card { display: flex; flex-direction: column; background: var(--color-surface-elevated); border: 1px solid var(--color-glass-border); border-radius: var(--radius-lg); overflow: hidden; transition: all var(--transition-normal); }
    .sov-press-card:hover { border-color: var(--color-border-strong); box-shadow: var(--shadow-card-hover); transform: translateY(-4px); }
    .sov-press-card__body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); flex: 1; }
    .sov-press-card__meta { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xs); color: var(--color-text-dim); }
    .sov-press-card__tag { padding: 2px 10px; border-radius: var(--radius-full); background: rgba(201,162,39,0.1); color: var(--sov-gold-300); font-weight: 500; }
    .sov-press-card__title { font-size: var(--text-xl); font-weight: 600; color: var(--color-text-main); line-height: var(--leading-snug); }
    .sov-press-card__excerpt { font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-relaxed); flex: 1; }
    .sov-press-card__link { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); font-weight: 500; color: var(--sov-gold-300); text-decoration: none; margin-top: var(--space-2); }
    .sov-press-card__link:hover { color: var(--sov-gold-500); }
    .sov-press-empty { text-align: center; padding: var(--space-20) var(--space-6); color: var(--color-text-dim); }
    @media (max-width: 640px) { .sov-press-grid { grid-template-columns: 1fr; padding: var(--space-6); } .sov-press-hero__title { font-size: var(--text-3xl); } }
  </style>
</head>
<body>
  <div id="shared-header"></div>

  <section class="sov-press-hero">
    <div class="sov-container">
      <h1 class="sov-press-hero__title"><span class="lang-en">Press & Media</span><span class="lang-ar">الإعلام والصحافة</span></h1>
      <p class="sov-press-hero__subtitle"><span class="lang-en">Official statements, press releases, and media resources from IIF.</span><span class="lang-ar">البيانات الرسمية والنشرات الصحفية والموارد الإعلامية من IIF.</span></p>
    </div>
  </section>

  <main class="sov-press-grid" id="press-grid"></main>

  <div id="shared-footer"></div>

  <script src="src/shared-nav.js"></script>
  <script src="src/shared-footer.js"></script>

  <script src="src/lang-init.js"></script>
  <script>
  fetch('data/news.json')
      .then(r => r.json())
      .then(data => {
        const grid = document.getElementById('press-grid');
        if (!data.items || data.items.length === 0) {
          grid.innerHTML = '<div class="sov-press-empty" style="grid-column:1/-1;"><div style="font-size:var(--text-5xl);margin-bottom:var(--space-4);opacity:0.4;">&#128196;</div><p>No articles found.</p></div>';
          return;
        }
        grid.innerHTML = data.items.map(item => {
          const d = new Date(item.date);
          const dateStr = d.toLocaleDateString(lang === 'ar' ? 'ar-SA' : 'en-US', { year: 'numeric', month: 'short', day: 'numeric' });
          return '<article class="sov-press-card sov-reveal">' +
            '<div class="sov-press-card__body">' +
              '<div class="sov-press-card__meta">' +
                '<span class="sov-press-card__tag">' + (lang === 'ar' ? item.tag.ar : item.tag.en) + '</span>' +
                '<span>' + dateStr + '</span>' +
              '</div>' +
              '<h2 class="sov-press-card__title">' +
                '<span class="lang-en">' + item.title.en + '</span>' +
                '<span class="lang-ar">' + item.title.ar + '</span>' +
              '</h2>' +
              '<p class="sov-press-card__excerpt">' +
                '<span class="lang-en">' + item.excerpt.en + '</span>' +
                '<span class="lang-ar">' + item.excerpt.ar + '</span>' +
              '</p>' +
              '<a href="' + item.link + '" class="sov-press-card__link">' +
                '<span class="lang-en">Read more &rarr;</span>' +
                '<span class="lang-ar">اقرأ المزيد &larr;</span>' +
              '</a>' +
            '</div>' +
          '</article>';
        }).join('');
      })
      .catch(() => {
        document.getElementById('press-grid').innerHTML = '<div class="sov-press-empty" style="grid-column:1/-1;"><p>Failed to load news. Please try again later.</p></div>';
      });
  })();
  </script>
</body>
</html>
